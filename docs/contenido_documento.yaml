problemas:
  - problema: "En Windows, la carpeta temporal del proyecto tenía una ruta tan larga que pip no podía instalar las librerías (límite de 260 caracteres)."
    solucion: "El proyecto se movió a una ruta corta (C:\\proyectos\\DataVoz) y se documentó en el README."
  - problema: "En la primera prueba real, «¿qué bebida se vendió menos?» se interpretó como los productos llamados «Bebida isotónica», «Bebida energética»… y la respuesta fue incorrecta."
    solucion: "La búsqueda de productos ahora detecta primero las categorías que menciona la pregunta («bebida» → categoría Bebidas) y el prompt del Analista distingue entre filtrar por categoría y por producto."
  - problema: "La pregunta de la ficha («¿qué producto se vendió menos en diciembre?») tiene muchos empates en 1 unidad, así que «el» producto no es único."
    solucion: "El Analista devuelve los 5 primeros para mostrar empates y el Narrador recibe como hecho calculado cuántos productos empatan. En la evaluación se usó la variante por categoría, que tiene una respuesta única."
  - problema: "El arnés de evaluación (con un LLM simulado) detectó que restar un BIGINT a una fecha falla en DuckDB, error que también tenía un ejemplo few-shot del RAG."
    solucion: "Se corrigieron el ejemplo y la consulta de referencia (CAST a INTEGER) y se agregó la regla al diccionario de datos."
  - problema: "La versión 16 de PyAV eliminó un parámetro que usa faster-whisper y la transcripción fallaba."
    solucion: "Los WAV se decodifican directamente con Python y NumPy (sin FFmpeg) y se fijó PyAV < 16 para los demás formatos."
  - problema: "La primera pregunta real tardó 50 s: cada agente tenía su propio limitador de peticiones y la cubeta empezaba vacía."
    solucion: "Un solo limitador compartido (la cuota de Gemini es por proyecto) que empieza lleno; una pregunta completa ya no espera."
  - problema: "La cuota gratuita de Gemini 2.5 Flash (el modelo de la ficha) es de solo 20 peticiones al día; la primera evaluación completa se quedó sin cuota en el caso 7 y los casos restantes fallaron por eso, no por el agente. Gemini 3.5 Flash estaba saturado (error 503)."
    solucion: "Se asignó un modelo por rol (3.1 Flash-Lite, muy rápido, para Orquestador, Visualizador, Narrador y Limpiador; 3.5 Flash-Lite para el Analista SQL), con respaldo automático entre modelos de Gemini. El evaluador distingue los fallos por cuota y puede reintentar solo esos casos (--reintentar-cuota)."
  - problema: "Con un modelo más ligero, el Analista unió inventario y ventas por fecha para contar días sin existencias y obtuvo 0 (los días agotados no tienen ventas), lo que llevó a una recomendación equivocada."
    solucion: "Se agregó la regla al diccionario de datos y al prompt del Analista, y un ejemplo few-shot que cuenta los días sin existencias directamente en inventario_diario."
  - problema: "El Visualizador tardaba unos 5 s en consultar al LLM incluso cuando la gráfica era obvia."
    solucion: "Las reglas deciden los casos de alta confianza (un número, una serie de tiempo, un ranking simple) y el LLM solo se consulta en los ambiguos."

n_pruebas: 86

texto_interfaz: |
  <p>La interfaz (Streamlit) usa un tema propio —azul marino con acento verde azulado, tipografía Inter e iconos SVG
  dibujados para DataVoz— y tiene cuatro pestañas. En <b>Conversación</b> el usuario escribe o graba su pregunta y
  recibe la respuesta, la gráfica interactiva y un desplegable «Cómo lo calculé» con el SQL, los datos, los
  reintentos y el tiempo de cada agente. El <b>Dashboard</b> se arma solo con cada pregunta. <b>Datos</b> muestra el
  origen, el reporte del Limpiador y una vista previa. <b>Trazas</b> muestra el recorrido de los agentes en el
  último turno. El panel lateral permite elegir, crear, renombrar o borrar <b>sesiones guardadas</b>, subir un
  CSV/Excel, grabar una nota de voz (con opción de revisar la transcripción antes de enviarla), generar el reporte PDF
  y ver las alertas automáticas.</p>

