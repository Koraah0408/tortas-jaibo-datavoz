problemas:
  - problema: "Al conectar el POS había que leer datos de producción sin poder afectarlos; el código del POS tiene la contraseña del administrador escrita en el programa."
    solucion: "Se creó un rol de PostgreSQL de solo lectura (datavoz_lector) sobre vistas sin datos personales y la app trabaja sobre una copia local en DuckDB. Nunca se usó la contraseña del POS."
  - problema: "En la primera evaluación de Jaibo (69 % de SQL), el Analista sumaba ventas.total (precio de cada renglón) para calcular el dinero cobrado, que no incluye extras, sobreprecio de las apps ni descuentos."
    solucion: "Reglas nuevas en el diccionario de datos y en el prompt: el dinero cobrado, las órdenes y el ticket se calculan con ordenes.monto_total. La revisión semántica del Orquestador detecta el error y obliga a reintentar (traza J09)."
  - problema: "El LLM del Asesor se equivocaba con los días de la semana: para «este fin de semana» proponía viernes, sábado y domingo."
    solucion: "Las fechas, los productos y los rangos se calculan o validan con reglas en Python; el LLM solo propone. Las comisiones y márgenes del LLM se descartan si el dueño no dijo un porcentaje."
  - problema: "La segunda evaluación de Jaibo no fue válida: una corrida de pytest en paralelo reconstruyó el índice compartido de ChromaDB a mitad de la evaluación."
    solucion: "Las pruebas usan un índice temporal y la búsqueda vuelve a abrir la colección si cambió. Se repitió la evaluación (eval_jaibo_v3)."
  - problema: "El buscador de Chedraui bloqueaba las búsquedas con «+» o apóstrofos, y algunos productos aparecían «no disponibles» en la tienda de Ciudad del Carmen."
    solucion: "La búsqueda codifica los espacios como %20 y quita apóstrofos; si la tienda regional no tiene el producto se usa el precio en línea, y los precios se guardan 7 días para no depender de la red."
  - problema: "En eval_jaibo_v4, «¿Cuántos pedidos hubo que rehacer en agosto?» buscó la palabra «rehacer» (y luego un estado 'Rehecho' inventado) en la columna estado y respondió 0 en lugar de 30."
    solucion: "La revisión semántica del Orquestador detecta cualquier valor de estado que no exista en el POS y obliga a reintentar; el diccionario explica que los pedidos rehechos son las órdenes canceladas por modificación."
  - problema: "El verificador marcaba como no respaldadas cifras correctas que el Narrador obtenía sumando dos filas («Didi y Rappi sumaron $33,733»)."
    solucion: "El verificador acepta la suma de dos valores del resultado; sigue rechazando cualquier otra cifra que no salga de los datos."
  - problema: "Con las notas de voz reales, Whisper escribió «Rapid» en lugar de Rappi y «Liddy» en lugar de Didi: su vocabulario de apoyo era solo de la tienda de abarrotes."
    solucion: "Se agregó al vocabulario de Whisper el menú y los canales de Tortas Jaibo; los 10 audios se transcribieron con similitud 0.992 y los audios de la tienda siguieron iguales."
  - problema: "En la versión publicada no cabe Whisper (es pesado para el plan gratuito de Streamlit Cloud)."
    solucion: "Si Whisper no está instalado, la nota de voz la transcribe Gemini. El micrófono quedó dentro de la misma caja donde se escribe."
  - problema: "Al pedir «el reporte de ventas del 18» el sistema generaba el PDF de la conversación, porque un patrón tomaba cualquier «reporte» o «PDF» como reporte de la sesión."
    solucion: "Herramienta nueva reporte_de_ventas y un patrón que manda «reporte, resumen o corte» de un periodo al Asesor; el PDF de la conversación solo se genera si se menciona la conversación."
  - problema: "La cuota gratuita de Gemini 2.5 Flash (el modelo de la ficha) es de 20 peticiones al día y se agotó en la primera evaluación."
    solucion: "Un modelo por rol (3.1 Flash-Lite y 3.5 Flash-Lite) con respaldo automático; el evaluador distingue los fallos por cuota."
  - problema: "Con datos de la tienda de abarrotes, el Analista unió inventario y ventas por fecha para contar días sin existencias y siempre obtenía 0."
    solucion: "Regla en el diccionario, ejemplo few-shot y revisión semántica que detecta esa unión."
  - problema: "La versión 16 de PyAV eliminó un parámetro que usa faster-whisper."
    solucion: "Los WAV se decodifican con NumPy (sin FFmpeg) y se fijó PyAV < 16 para los demás formatos."

texto_interfaz: |
  <p>La interfaz (Streamlit) usa los colores y el logotipo de Tortas Jaibo y está pensada para el dueño, no para un
  analista. Al abrir muestra un resumen de la semana y cuatro accesos directos (pan, canales, promociones y compras). En
  <b>Preguntar</b> el dueño escribe o toca el micrófono en la misma caja; cada respuesta trae la gráfica, la
  recomendación destacada, la marca de «cifras verificadas», un desplegable «Ver cómo lo calculé» con el SQL o la
  herramienta y los supuestos, y tres sugerencias para seguir preguntando. <b>Mi semana</b> tiene indicadores y cuatro
  gráficas, <b>Reportes</b> reúne todos los PDF generados y los reportes diarios del correo, y <b>Mi tablero</b> guarda las
  gráficas de la conversación. «Mi semana» muestra además las <b>alertas automáticas</b>. En la barra lateral, <b>Revisar
  un archivo de ventas</b> simula la carga de un CSV o Excel: el Limpiador propone los cambios con ejemplos y botones
  <b>Aprobar y cargar</b> o <b>Cancelar</b>, y solo con la aprobación lo carga en una base de prueba de una conversación
  nueva (nunca en el POS). La versión publicada en Streamlit Cloud pide contraseña y funciona en el celular. Las
  capturas usan la demostración con ventas simuladas.</p>

