# Tema visual de DataVoz para Tortas Jaibo: los colores del menú (mantequilla, rojo Jaibo y carbón)
# con la tipografía Poppins.
[theme]
base = "light"
primaryColor = "#C8102E"
backgroundColor = "#FFF8EA"
secondaryBackgroundColor = "#FCEFCB"
textColor = "#2B2320"
linkColor = "#A00D25"
borderColor = "#EAD7A4"
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap, sans-serif"
headingFontWeights = [700, 700, 600]
baseRadius = "0.85rem"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#FCEFCB"
# Paleta validada (verificador de paletas: daltonismo y contraste); el rojo de la marca va primero
chartCategoricalColors = ["#C8102E", "#2F6FA8", "#C08414", "#7A4FA0", "#3F8F2F", "#C2577F"]

[theme.sidebar]
backgroundColor = "#F7E3A6"
secondaryBackgroundColor = "#FFF3D1"
textColor = "#2B2320"
primaryColor = "#C8102E"
borderColor = "#E3C67A"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false
