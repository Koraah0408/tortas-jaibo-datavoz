# Casos de prueba de DataVoz para Tortas Jaibo (36 casos: 31 originales + 5 de control agregados tras v1).
# Se corren con:  python evaluacion/ejecutar_evaluacion.py --negocio jaibo
#
# Base: datos SINTÉTICOS de Tortas Jaibo (scripts/generar_datos_jaibo.py, semilla fija: mismo menú y misma
# estructura que el POS real, ventas simuladas) para que la evaluación sea reproducible y sus trazas se puedan
# publicar. Con --base real se corre contra la copia del POS (los resultados se guardan en data/jaibo/, fuera de git).
# "Hoy" se fija al día siguiente del último dato (DATAVOZ_HOY) y los costos salen de la plantilla con supuestos.
#
# Distribución: 6 simples · 4 comparativas · 1 base + 2 de seguimiento (memoria) · 11 de decisión ·
#               1 base + 1 seguimiento de decisión · 5 de seguridad o fuera de alcance.
# Las preguntas están redactadas distinto a los ejemplos del RAG (conocimiento/jaibo/ejemplos_sql.yaml).
#
# Campos (además de los de casos_prueba.yaml):
#   agente_esperado: "asesor" (pregunta de decisión) o "analista" (pregunta sobre ventas pasadas)
#   herramienta: herramienta que debe elegir el Asesor de negocio
#   parametros_esperados: parámetros que debe usar; fechas relativas a "hoy": "+1" = mañana, o un día de la semana
#   (el siguiente). La referencia se calcula corriendo la herramienta con estos parámetros.

casos:
  # ------------------------------------------------------------------ simples
  - id: J01
    categoria: simple
    agente_esperado: analista
    pregunta: ¿Cuánto dinero cobré en octubre de 2026?
    sql_referencia: |
      SELECT ROUND(SUM(monto_total), 2) AS vendido FROM ordenes WHERE NOT cancelada AND anio = 2026 AND mes = 10
    grafica_ideal: [ninguna, indicador]
    grafica_aceptable: [tabla]

  - id: J02
    categoria: simple
    agente_esperado: analista
    pregunta: ¿Cuáles son mis 5 productos más vendidos?
    sql_referencia: |
      SELECT producto, SUM(cantidad) AS unidades FROM ventas WHERE categoria <> 'Interno'
      GROUP BY producto ORDER BY unidades DESC LIMIT 5
    alternativas:
      - SELECT producto, SUM(cantidad) AS unidades FROM ventas GROUP BY producto ORDER BY unidades DESC LIMIT 5
    clave: producto
    ordenado: true
    grafica_ideal: [barras, barras_horizontales]
    grafica_aceptable: [pastel]

  - id: J03
    categoria: simple
    agente_esperado: analista
    pregunta: ¿En qué canal fue más alto el ticket promedio en octubre de 2026?
    sql_referencia: |
      SELECT canal, ROUND(AVG(monto_total), 2) AS ticket_promedio FROM ordenes
      WHERE NOT cancelada AND anio = 2026 AND mes = 10 GROUP BY canal ORDER BY ticket_promedio DESC LIMIT 1
    alternativas:
      - |
        SELECT canal, ROUND(AVG(monto_total), 2) AS ticket_promedio FROM ordenes
        WHERE NOT cancelada AND anio = 2026 AND mes = 10 GROUP BY canal ORDER BY ticket_promedio DESC
    clave: canal
    ordenado: true
    grafica_ideal: [barras, barras_horizontales]
    grafica_aceptable: [indicador, tabla]

  - id: J04
    categoria: simple
    agente_esperado: analista
    pregunta: ¿Cuántos pedidos se tuvieron que corregir en septiembre de 2026?
    sql_referencia: SELECT COUNT(*) AS corregidas FROM ordenes WHERE cancelada AND anio = 2026 AND mes = 9
    grafica_ideal: [ninguna, indicador]
    grafica_aceptable: [tabla]

  - id: J05
    categoria: simple
    agente_esperado: analista
    pregunta: ¿Cuántos tacos de barbacoa salieron en agosto de 2026?
    sql_referencia: |
      SELECT SUM(cantidad) AS tacos FROM ventas WHERE producto = 'Tacos de barbacoa' AND anio = 2026 AND mes = 8
    grafica_ideal: [ninguna, indicador]
    grafica_aceptable: [tabla]

  - id: J06
    categoria: simple
    agente_esperado: analista   # habla de pan, pero de lo que YA pasó: no es un pronóstico
    pregunta: ¿Cuántos panes mega se gastaron en los últimos 7 días?
    sql_referencia: |
      SELECT SUM(cantidad) AS pan_mega FROM ventas
      WHERE producto IN ('Mega barda', 'Mega pierna', 'Mega mixta', 'Mega barbacoa')
        AND fecha > (SELECT MAX(fecha) FROM ventas) - INTERVAL 7 DAY
    alternativas:
      - |
        SELECT fecha, SUM(cantidad) AS pan_mega FROM ventas
        WHERE producto IN ('Mega barda', 'Mega pierna', 'Mega mixta', 'Mega barbacoa')
          AND fecha > (SELECT MAX(fecha) FROM ventas) - INTERVAL 7 DAY
        GROUP BY fecha ORDER BY fecha
    comparar: [pan_mega]
    grafica_ideal: [ninguna, indicador, barras, lineas]
    grafica_aceptable: [tabla]

  # ------------------------------------------------------------ comparativas
  - id: J07
    categoria: comparativa
    agente_esperado: analista
    pregunta: Compara cuánto vendí en Didi contra Rappi en septiembre y octubre de 2026
    sql_referencia: |
      SELECT mes, canal, ROUND(SUM(monto_total), 2) AS vendido FROM ordenes
      WHERE NOT cancelada AND anio = 2026 AND mes IN (9, 10) AND canal IN ('Didi', 'Rappi')
      GROUP BY mes, canal ORDER BY mes, canal
    comparar: [vendido]
    grafica_ideal: [barras]
    grafica_aceptable: [lineas, barras_horizontales, tabla]

  - id: J08
    categoria: comparativa
    agente_esperado: analista
    pregunta: ¿Se venden más gorditas en fin de semana o entre semana? Dame el promedio por día
    sql_referencia: |
      WITH dias AS (SELECT es_fin_de_semana, COUNT(DISTINCT fecha) AS n FROM ordenes GROUP BY es_fin_de_semana)
      SELECT v.es_fin_de_semana, ROUND(SUM(v.cantidad) * 1.0 / MAX(d.n), 1) AS gorditas_por_dia
      FROM ventas v JOIN dias d ON v.es_fin_de_semana = d.es_fin_de_semana
      WHERE v.producto = 'Gordita' GROUP BY v.es_fin_de_semana
    comparar: [gorditas_por_dia]
    grafica_ideal: [barras]
    grafica_aceptable: [pastel, tabla, indicador]

  - id: J09
    categoria: comparativa
    agente_esperado: analista
    pregunta: ¿Qué día de la semana cobro más dinero?
    sql_referencia: |
      SELECT dia_semana, ROUND(SUM(monto_total), 2) AS vendido FROM ordenes WHERE NOT cancelada
      GROUP BY dia_semana ORDER BY vendido DESC LIMIT 1
    alternativas:
      - |
        SELECT dia_semana, ROUND(SUM(monto_total), 2) AS vendido FROM ordenes WHERE NOT cancelada
        GROUP BY dia_semana ORDER BY vendido DESC
    clave: dia_semana
    ordenado: true
    grafica_ideal: [barras]
    grafica_aceptable: [barras_horizontales, indicador, lineas]

  - id: J10
    categoria: comparativa
    agente_esperado: analista
    pregunta: ¿Cuánto se vendió a crédito a las empresas en octubre de 2026 comparado con septiembre?
    sql_referencia: |
      SELECT mes, ROUND(SUM(monto_total), 2) AS a_credito FROM ordenes
      WHERE NOT cancelada AND anio = 2026 AND mes IN (9, 10)
        AND metodo_pago IN ('Crédito Empleado', 'Crédito Automatas', 'Crédito y Efectivo')
      GROUP BY mes ORDER BY mes
    alternativas:
      - |
        SELECT mes, ROUND(SUM(monto_total), 2) AS a_credito FROM ordenes
        WHERE NOT cancelada AND anio = 2026 AND mes IN (9, 10) AND canal IN ('Legacy', 'Automatas')
        GROUP BY mes ORDER BY mes
      - |
        SELECT mes, canal, ROUND(SUM(monto_total), 2) AS a_credito FROM ordenes
        WHERE NOT cancelada AND anio = 2026 AND mes IN (9, 10) AND canal IN ('Legacy', 'Automatas')
        GROUP BY mes, canal ORDER BY mes, canal
    comparar: [a_credito]
    grafica_ideal: [barras]
    grafica_aceptable: [lineas, tabla, barras_horizontales]

