    grafica_ideal: [barras]
    grafica_aceptable: [tabla, indicador, barras_horizontales]

  # ------------------------------------------------- casos nuevos (control)
  # Se escribieron DESPUÉS de eval_jaibo_v1 y ANTES de corregir nada con ellos: miden si las correcciones
  # hechas tras ver los fallos de v1 generalizan a preguntas parecidas que el sistema no había visto.
  - id: JH1
    categoria: simple
    agente_esperado: analista
    pregunta: ¿Cuánto vendí en Rappi en agosto de 2026?
    sql_referencia: |
      SELECT ROUND(SUM(monto_total), 2) AS vendido FROM ordenes
      WHERE NOT cancelada AND canal = 'Rappi' AND anio = 2026 AND mes = 8
    grafica_ideal: [ninguna, indicador]
    grafica_aceptable: [tabla]

  - id: JH2
    categoria: simple
    agente_esperado: analista
    pregunta: ¿Cuántos pedidos hubo que rehacer en agosto de 2026?
    sql_referencia: SELECT COUNT(*) AS rehechos FROM ordenes WHERE cancelada AND anio = 2026 AND mes = 8
    grafica_ideal: [ninguna, indicador]
